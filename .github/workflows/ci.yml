name: CI

# 合并代码 / 提交 PR 时触发：只做代码检查与 Docker 构建检查，不推送任何镜像
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS 语法检查
        run: |
          node --check server.js
          node --check public/app.js

      - name: 服务冒烟测试
        run: |
          node server.js &
          sleep 2
          curl -fsS http://127.0.0.1:3777/healthz
          curl -fsS -o /dev/null -w '首页 HTTP %{http_code}\n' http://127.0.0.1:3777/

  docker-build-check:
    name: Docker 构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅验证可构建，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: modellens:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
